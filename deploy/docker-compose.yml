# ola production stack (one server). Usage (from the repository root):
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: buddyai

services:
  postgres:
    # postgres:16-alpine + the pgvector extension files (long-term memory). Same data volume, see the Dockerfile.
    build:
      context: ..
      dockerfile: deploy/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: buddyai
      POSTGRES_USER: buddyai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddyai -d buddyai"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      BUDDYAI_DATABASE_URL: postgresql+psycopg://buddyai:${POSTGRES_PASSWORD}@postgres:5432/buddyai
      BUDDYAI_PUBLIC_URL: https://${API_DOMAIN}
      BUDDYAI_APP_URL: https://${APP_DOMAIN}
      BUDDYAI_SITE_URL: https://${SITE_DOMAIN}
      BUDDYAI_FORWARDED_ALLOW_IPS: "*" # only Caddy can reach the server (no published port)
      BUDDYAI_LOG_JSON: "true"
      BUDDYAI_MDNS_ENABLED: "false"
      BUDDYAI_ALLOW_WEB_SETUP: "false" # create the operator with: docker compose exec server python -m app.cli create-operator <name>
    volumes:
      - serverdata:/data # secret key, firmware images, provider keys set from the web UI
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  # Daily database dump (deploy/backup/backup.sh): verified, checksummed, 14 days kept in ./backups.
  # Optional (deploy/.env, see README section 8): age encryption, rclone off-site copy, serverdata tar.
  backup:
    build:
      context: backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGUSER: buddyai
      PGDATABASE: buddyai
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}         # age1... PUBLIC key only
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}         # e.g. offsite:buddyai-backups
      BACKUP_RCLONE_CONFIG_B64: ${BACKUP_RCLONE_CONFIG_B64:-} # base64 rclone.conf (or deploy/backup.env)
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-}   # default 30
      BACKUP_LOCAL_KEEP_DAYS: ${BACKUP_LOCAL_KEEP_DAYS:-}     # default 14
      BACKUP_INTERVAL_S: ${BACKUP_INTERVAL_S:-}               # default 86400
      BACKUP_SERVERDATA: ${BACKUP_SERVERDATA:-}               # 1 = also back up the serverdata volume
    env_file:
      # Optional: RCLONE_CONFIG_<REMOTE>_* variables for the off-site remote (README section 8).
      - path: backup.env
        required: false
    volumes:
      - ./backups:/backups
      - serverdata:/serverdata:ro # read only; backed up only with BACKUP_SERVERDATA=1
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  serverdata:
  caddy_data:
  caddy_config:
